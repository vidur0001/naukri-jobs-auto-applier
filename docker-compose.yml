version: '3.8'

services:
  naukri-bot:
    build: .
    ports:
      - "5000:5000"
      - "6080:6080"
    volumes:
      - ./naukri_storage_state.json:/app/naukri_storage_state.json
      - ./config.json:/app/config.json
      - ./decisions:/app/decisions
      - ./seen_jobs.json:/app/seen_jobs.json
      - ./daily_stats.json:/app/daily_stats.json
    env_file:
      - .env
    environment:
      - APP_BASE_URL=http://13.61.172.107:5000
    restart: unless-stopped
