version: '3.8'

services:
  naukri-bot:
    build: .
    ports:
      - "5000:5000"
      - "6080:6080"
    volumes:
      - ./naukri_storage_state.json:/app/naukri_storage_state.json
      - ./config.json:/app/config.json
      - ./decisions:/app/decisions
      - ./seen_jobs.json:/app/seen_jobs.json
      - ./daily_stats.json:/app/daily_stats.json
      - ./applications_log.json:/app/applications_log.json
    env_file:
      - .env
    environment:
      - APP_BASE_URL=https://naukri-bot.duckdns.org
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443" 
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN}
    depends_on:
      - naukri-bot
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
